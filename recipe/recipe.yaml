schema_version: 1

context:
  name: libmicrohttpd
  version: "1.0.6"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://ftp.gnu.org/gnu/libmicrohttpd/libmicrohttpd-${{ version }}.tar.gz
  sha256: bb5cfcadfc52dbd5eb512d6e2995e0361351c33e97a87aba426d3a4a7ba6cf70

build:
  number: 0
  skip: win

requirements:
  build:
    - if: unix
      then:
        - gnuconfig
        - pkg-config
    - ${{ compiler('c') }}
    - ${{ stdlib("c") }}
    - make
  host:
    - gnutls
  run_exports:
    - ${{ pin_subpackage("libmicrohttpd", upper_bound="x.x") }}

tests:
  - script:
      - if: unix
        then:
          - test -f $PREFIX/lib/libmicrohttpd${SHLIB_EXT}
          - test -f $PREFIX/include/microhttpd.h
about:
  license: LGPL-2.0-or-later
  license_file: COPYING
  summary: Light HTTP/1.1 server library
  homepage: https://www.gnu.org/software/libmicrohttpd/

extra:
  recipe-maintainers:
    - xhochy
